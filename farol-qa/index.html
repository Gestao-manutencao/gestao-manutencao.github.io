<title>Farol QA Manutenção – Vidro</title>

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1320;--surface:#161e2e;--ink:#f4f7fb;--ink2:#d3dbe8;--muted:#a3afc2;--line:#2c3850;
  --ok:#4ade80;--ok-bg:#12351f;--bad:#ff7a7a;--bad-bg:#431919;--na:#a3afc2;--na-bg:#242e42;--accent:#8ab4ff;}}
:root[data-theme="dark"]{
  --bg:#0d1320;--surface:#161e2e;--ink:#f4f7fb;--ink2:#d3dbe8;--muted:#a3afc2;--line:#2c3850;
  --ok:#4ade80;--ok-bg:#12351f;--bad:#ff7a7a;--bad-bg:#431919;--na:#a3afc2;--na-bg:#242e42;--accent:#8ab4ff;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:1200px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:16px}
h1{margin:0;font-size:26px;letter-spacing:-.01em}
.sub{color:var(--ink2);font-size:15px;margin-top:2px}
.tools{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
label.f{display:flex;flex-direction:column;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;gap:4px}
select{font:600 15px inherit;font-family:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;min-height:40px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
.chip{font:700 14px inherit;font-family:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:8px 16px;cursor:pointer;min-height:40px}
.chip[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
:root[data-theme="dark"] .chip[aria-pressed="true"]{color:#0d1320}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip[aria-pressed="true"]{color:#0d1320}}
.meta{font-weight:700;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:8px 12px;min-height:40px;display:flex;align-items:center}
h2{font-size:18px;margin:28px 0 10px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.card{background:var(--surface);border:1.5px solid var(--line);border-left:6px solid var(--na);border-radius:12px;padding:14px;cursor:pointer;text-align:left;font-family:inherit;color:var(--ink)}
.card.ok{border-left-color:var(--ok)}.card.bad{border-left-color:var(--bad)}
.card .nm{font-weight:800;font-size:15px;color:var(--ink2)}
.card .big{font-size:38px;font-weight:800;line-height:1.1;margin:4px 0 6px;font-variant-numeric:tabular-nums}
.ok .big,.v.ok{color:var(--ok)}.bad .big,.v.bad{color:var(--bad)}.na .big,.v.na{color:var(--na)}
.badge{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:13px;padding:3px 10px;border-radius:999px}
.badge.ok{background:var(--ok-bg);color:var(--ok)}.badge.bad{background:var(--bad-bg);color:var(--bad)}.badge.na{background:var(--na-bg);color:var(--na)}
.mini{display:grid;grid-template-columns:1fr auto;gap:2px 8px;margin-top:10px;font-size:14px;color:var(--ink2)}
.mini b{font-variant-numeric:tabular-nums}
.panel{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:14px;overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
th{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:800}
th:first-child,td:first-child{text-align:left}
td{font-weight:700;font-size:16px}
td.v{font-weight:800}
tr.grp td{background:var(--na-bg);font-weight:800;color:var(--ink);text-align:left;font-size:15px}
.mx{min-width:1100px}.mx th,.mx td{text-align:center;padding:9px 5px;white-space:nowrap}.mx td{font-size:15px}.mx .dot{margin-right:5px;width:10px;height:10px}.mx th.g{border-left:2px solid var(--ink);border-bottom:1px solid var(--line);font-size:14px;color:var(--ink)}
.mx td.c{border-left:1px solid var(--line)}.mx td.c.f{border-left:2px solid var(--ink)}.mx th.l,.mx td.l{text-align:left}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:7px;vertical-align:middle}.dot.ok{background:var(--ok)}.dot.bad{background:var(--bad)}.dot.na{background:var(--na)}
td .st{font-size:13px;margin-left:6px}
td.nm{font-weight:800;color:var(--ink)}
.sq{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px;vertical-align:middle}
.sq.ok{background:var(--ok)}.sq.bad{background:var(--bad)}.sq.na{background:var(--na)}
svg text{font-family:inherit}
#tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);padding:8px 10px;border-radius:8px;font-size:13px;line-height:1.4;max-width:260px;z-index:9;display:none;box-shadow:0 4px 14px rgba(0,0,0,.3)}
#tip b{font-size:14px}
.pl{max-height:560px;overflow:auto}.ol{min-width:900px}.ol th,.ol td{text-align:left;white-space:nowrap}.ol td{font-size:15px}.ol th{position:sticky;top:0;background:var(--surface);z-index:1;border-bottom:2px solid var(--line)}.ol td.loc{font-weight:600}
.ol .badge.na{color:var(--ink);border:1px solid var(--ink2)}
.empty{color:var(--muted);padding:8px}

const stTxt={ok:'✓ Meta',bad:'✕ Abaixo',na:'Sem dado'};
const ymLabel=k=>MN[(k%100)-1]+'/'+Math.floor(k/100);
const ends=D.meses.filter(m=>m>=202601&&m<=202611);
let sel={mes:ends[ends.length-1],linha:'ALL'};
const mes=document.getElementById('mes');
ends.slice().reverse().forEach(m=>{const o=document.createElement('option');o.value=m;o.textContent=ymLabel(m);mes.appendChild(o)});
mes.onchange=()=>{sel.mes=+mes.value;render()};

function window12(end){const out=[];let y=Math.floor(end/100),m=end%100;for(let i=0;i<13;i++){out.push(y*100+m);m--;if(m==0){m=12;y--}}return out}
function mpaOf(q,win){let c=0,t=0;win.forEach(k=>{const v=q.mpa[k];if(v){c+=v[0];t+=v[1]}});return{c,t,r:t?c/t:null}}
function eqCalc(q,win){
  const p=q.pmid[1]?q.pmid[0]/q.pmid[1]:null, s=q.saude[1]?q.saude[0]/q.saude[1]:null, m=mpaOf(q,win);
  const f=(p!=null&&s!=null&&m.r!=null)?p*s*m.r:null;
  return{p,s,m:m.r,f,pn:q.pmid,sn:q.saude,mn:[m.c,m.t]};
}
function lineCalc(L,win){
  const eqs=L.eq.map(q=>({id:q.id,...eqCalc(q,win)}));
  const ps=eqs.map(e=>e.p).filter(v=>v!=null);
  const p=ps.length?ps.reduce((a,b)=>a+b,0)/ps.length:null;
  let sf=L.saude[0],st_=L.saude[1],mc=0,mt=0;eqs.forEach(e=>{mc+=e.mn[0];mt+=e.mn[1]});
  const s=st_?sf/st_:null,m=mt?mc/mt:null;
  const f=(p!=null&&s!=null&&m!=null)?p*s*m:null;
  return{id:L.id,p,s,m,f,sn:[sf,st_],mn:[mc,mt],eqs};
}
const tip=document.getElementById('tip');
function showTip(e,html){tip.innerHTML=html;tip.style.display='block';moveTip(e)}
function moveTip(e){const x=Math.min(e.clientX+14,innerWidth-tip.offsetWidth-8),y=e.clientY+14;tip.style.left=x+'px';tip.style.top=y+'px'}
function hideTip(){tip.style.display='none'}
const pc=v=>fmt(v);

function render(){
  const win=window12(sel.mes);
  const all=D.linhas.map(L=>lineCalc(L,win));
  const shown=sel.linha==='ALL'?all:all.filter(l=>l.id===sel.linha);
  // chips
  const ch=document.getElementById('chips');ch.innerHTML='';
  [['ALL','Todas as linhas'],...D.linhas.map(l=>[l.id,l.id])].forEach(([id,t])=>{
    const b=document.createElement('button');b.className='chip';b.textContent=t;b.setAttribute('aria-pressed',sel.linha===id);
    b.onclick=()=>{sel.linha=id;render()};ch.appendChild(b)});
  // cards
  const cd=document.getElementById('cards');cd.innerHTML='';
  shown.forEach(l=>{
    const s=st(l.f);const b=document.createElement('button');b.className='card '+s;
    b.innerHTML=`<div class="nm">${l.id}</div><div class="big">${fmt(l.f)}</div><span class="badge ${s}">${stTxt[s]}</span>
      <div class="mini"><span>PM ID</span><b class="v ${st(l.p)}">${fmt(l.p)}</b><span>Saúde</span><b class="v ${st(l.s)}">${fmt(l.s)}</b><span>MPA</span><b class="v ${st(l.m)}">${fmt(l.m)}</b></div>`;
    b.onclick=()=>{sel.linha=sel.linha===l.id?'ALL':l.id;render()};
    cd.appendChild(b)});
  // chart
  chart(shown);
  // table lines
  const tl=document.getElementById('tl');tl.className='mx';
  const EQS=['ARR','ECH','EBI','LAV'];
  const cell=(v,first)=>v==null?`<td class="c${first?' f':''} na">—</td>`:`<td class="c${first?' f':''} v ${st(v)}"><span class="dot ${st(v)}"></span>${fmt(v)}</td>`;
  let mh='<tr><th class="l" rowspan="2">Linha</th><th rowspan="2">Farol</th><th class="g" colspan="4">PM ID</th><th class="g" colspan="4">Saúde</th><th class="g" colspan="4">MPA</th></tr><tr>'+['p','s','m'].map(()=>EQS.map((e,i)=>`<th${i==0?' class="g"':''}>${e}</th>`).join('')).join('')+'</tr>';
  shown.forEach(l=>{const g=id=>l.eqs.find(e=>e.id===id)||{};
    mh+=`<tr><td class="l nm">${l.id}</td><td class="v ${st(l.f)}"><span class="dot ${st(l.f)}"></span>${fmt(l.f)}</td>`+['p','s','m'].map(k=>EQS.map((e,i)=>cell(g(e)[k]==null?null:g(e)[k],i==0)).join('')).join('')+'</tr>'});
  tl.innerHTML=mh;
  // ordens pendentes
  const te=document.getElementById('te');
  const w0=win[win.length-1],w1=win[0],ids=new Set(shown.map(l=>l.id));
  const g={};
  D.pend.forEach(p=>{const ym=p[6]*100+p[7];if(ym<w0||ym>w1||!ids.has(p[0]))return;
    const k=[p[0],p[2],p[4],p[5],p[6],p[7]].join('|');
    const o=g[k]||(g[k]={l:p[0],ord:p[2],loc:p[4],tp:p[5],a:p[6],m:p[7],n:0,tm:0,cf:0,cm:0});o.n++;if(p[8]==1)o.tm=1;else if(p[8]==2)o.cm=1;else o.cf=1});
  const rows=Object.values(g).sort((x,y)=>(x.a*100+x.m)-(y.a*100+y.m)||x.l.localeCompare(y.l)||x.ord.localeCompare(y.ord));
  document.getElementById('ph').textContent='Ordens pendentes ('+rows.length+')';
  let h='<thead><tr><th>Linha</th><th>Ordem</th><th>Local de instalação</th><th>Tipo de atividade</th><th>Ano</th><th>Mês</th><th>Status</th></tr></thead><tbody>';
  rows.forEach(r=>{h+=`<tr><td class="nm">${r.l}</td><td>${r.ord}</td><td class="loc">${r.loc}</td><td class="${TRED.has(r.tp)?'v bad':''}">${TIPO[r.tp]||r.tp}</td><td>${r.a}</td><td>${MN[r.m-1]}</td><td>${r.tm?'<span class="badge bad">Troca mandatória</span>':''}${(r.tm&&(r.cf||r.cm))||(r.cm&&r.cf)?' ':''}${r.cm?'<span class="badge na">Pend. Confirmação + Retirada Mat</span>':''}${r.cf?'<span class="badge na">Falta confirmação</span>':''}</td></tr>`});
  if(!rows.length)h+='<tr><td colspan="7" class="empty">Nenhuma ordem pendente na janela.</td></tr>';
  te.innerHTML=h+'</tbody>';
}
function chart(shown){
  const W=Math.max(560,document.getElementById('chart').clientWidth||900),rowH=44,padL=64,padR=84,H=shown.length*rowH+34;
  const x=v=>padL+(W-padL-padR)*Math.max(0,v);
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Farol por linha">`;
  [0,0.25,0.5,0.75,1].forEach(t=>{s+=`<line x1="${x(t)}" x2="${x(t)}" y1="0" y2="${H-26}" stroke="var(--line)" stroke-width="1"/><text x="${x(t)}" y="${H-8}" text-anchor="middle" font-size="12" fill="var(--muted)">${Math.round(t*100)}%</text>`});
  shown.forEach((l,i)=>{const y=i*rowH+6,v=l.f,c=`var(--${st(v)==='ok'?'ok':st(v)==='bad'?'bad':'na'})`;
    s+=`<text x="${padL-10}" y="${y+16}" text-anchor="end" font-size="14" font-weight="800" fill="var(--ink)">${l.id}</text>`;
    if(v!=null){const w=Math.max(2,x(v)-padL);
      s+=`<rect data-i="${i}" x="${padL}" y="${y}" width="${w}" height="26" rx="4" fill="${c}"/><text x="${W-padR+12}" y="${y+18}" font-size="15" font-weight="800" fill="${c}">${fmt(v)}</text>`}
    s+=`<rect class="hit" data-i="${i}" x="0" y="${y-4}" width="${W}" height="${rowH-4}" fill="transparent"/>`});
  s+=`<line x1="${x(META)}" x2="${x(META)}" y1="0" y2="${H-26}" stroke="var(--ink)" stroke-width="2" stroke-dasharray="5 4"/></svg>`;
  const c=document.getElementById('chart');c.innerHTML=s;
  c.querySelectorAll('.hit').forEach(r=>{const l=shown[+r.dataset.i];
    r.onmousemove=e=>showTip(e,`<b>${l.id} · Farol ${fmt(l.f)}</b><br>PM ID ${fmt(l.p)}<br>Saúde ${fmt(l.s)} (${l.sn[0]}/${l.sn[1]} PM)<br>MPA ${fmt(l.m)} (${l.mn[0]}/${l.mn[1]} operações)`);
    r.onmouseleave=hideTip});
}
addEventListener('resize',()=>render());
render();
</script>
</body>
</html>
