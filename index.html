<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Gestão da Manutenção</title>
<script>
(function(){var t=null;try{t=localStorage.getItem('portalTheme')}catch(e){}
if(t!=='light'&&t!=='dark'){t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}
document.documentElement.dataset.theme=t})();
</script>
<style>
:root{--bg:#f3f4f6;--side:#0f2a47;--ink:#ffffff;--ink2:#d4e0ee;--act-bg:#ffffff;--act-ink:#0f2a47;--line:rgba(255,255,255,.35);--focus:#93c5fd;color-scheme:light}
:root[data-theme="dark"]{--bg:#0e1117;--side:#0a1626;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:grid;grid-template-columns:272px 1fr;height:100dvh;overflow:hidden;-webkit-text-size-adjust:100%}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
aside{background:var(--side);display:flex;flex-direction:column;gap:18px;padding:20px 14px;overflow:auto;min-height:0}
.brand{padding:0 8px}
.brand b{display:block;font-size:20px;line-height:1.2}
.brand span{display:block;margin-top:4px;color:var(--ink2);font-size:14px;font-weight:600}
nav{display:flex;flex-direction:column;gap:6px}
nav a,nav .off{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;text-decoration:none;color:var(--ink);font-weight:700;font-size:15px}
nav a:hover{background:rgba(255,255,255,.16)}
nav a[aria-current="page"]{background:var(--act-bg);color:var(--act-ink)}
nav .off{border:1px dashed var(--line);color:var(--ink2);cursor:default}
nav svg{flex:none;width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav .txt{display:flex;flex-direction:column;min-width:0}
nav .tag{font-size:12px;font-weight:600;color:var(--ink2)}
.sep{height:1px;background:var(--line);margin:2px 8px}
.foot{margin-top:auto;padding:0 4px}
.tbtn{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;background:rgba(255,255,255,.14);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:10px 12px;font-weight:700}
.tbtn:hover{background:rgba(255,255,255,.24)}
main{position:relative;min-width:0;min-height:0}
main iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:var(--bg)}
main iframe.on{display:block}
.top,.scrim{display:none}
@media (max-width:820px){
  body{grid-template-columns:1fr;grid-template-rows:54px 1fr}
  .top{display:flex;align-items:center;gap:12px;background:var(--side);color:var(--ink);padding:0 12px;padding-top:env(safe-area-inset-top,0px)}
  .top button{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.14);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:8px 12px;font-weight:700}
  .top svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
  .top strong{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  aside{position:fixed;left:0;right:0;top:54px;z-index:20;max-height:calc(100dvh - 54px);transform:translateY(-110%);visibility:hidden;transition:transform .18s ease,visibility .18s;box-shadow:0 12px 28px rgba(0,0,0,.4)}
  body.open aside{transform:none;visibility:visible}
  .scrim{position:fixed;inset:54px 0 0 0;z-index:10;background:rgba(0,0,0,.45)}
  body.open .scrim{display:block}
  .foot{margin-top:6px}
}
@media (prefers-reduced-motion:reduce){aside{transition:none}}
</style>
</head>
<body>
<aside id="side">
  <div class="brand"><b>Gestão da Manutenção</b><span>F. Rio de Janeiro · Packaging</span></div>
  <nav aria-label="Relatórios">
    <a href="#compromisso-gf" data-id="compromisso-gf"><svg viewBox="0 0 24 24"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg><span class="txt">Compromisso do GF</span></a>
    <a href="#tecnicos" data-id="tecnicos"><svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2M9.5 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8M21 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg><span class="txt">% Técnicos &gt;10 ordens</span></a>
    <a href="#operador" data-id="operador"><svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/></svg><span class="txt">% Operador Relatando</span></a>
    <div class="sep"></div>
    <div class="off" aria-disabled="true"><svg viewBox="0 0 24 24"><path d="M22 11.1V12a10 10 0 1 1-5.9-9.1M22 4 12 14l-3-3"/></svg><span class="txt">Farol QA<span class="tag">Em desenvolvimento</span></span></div>
    <div class="off" aria-disabled="true"><svg viewBox="0 0 24 24"><path d="M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16M21 21l-4.3-4.3"/></svg><span class="txt">Inspeção Vs Monitoramento<span class="tag">Em desenvolvimento</span></span></div>
    <div class="off" aria-disabled="true"><svg viewBox="0 0 24 24"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg><span class="txt">Custo<span class="tag">Em breve</span></span></div>
  </nav>
  <div class="foot"><button class="tbtn" id="tbtn" type="button"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3v18" /><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg>Tema</button></div>
</aside>
<header class="top">
  <button id="mbtn" type="button" aria-controls="side" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>Menu</button>
  <strong id="ttl">Compromisso do GF</strong>
</header>
<div class="scrim" id="scrim"></div>
<main id="main"></main>
<script>
(function(){
var ITEMS={
  'compromisso-gf':{src:'compromisso-gf/index.html',title:'Compromisso do GF'},
  'tecnicos':{src:'tecnicos/index.html',title:'% Técnicos >10 ordens'},
  'operador':{src:'operador-relatando/index.html',title:'% Operador Relatando'}
};
var DEFAULT='compromisso-gf';
var root=document.documentElement, main=document.getElementById('main'), ttl=document.getElementById('ttl');
var frames={}, cur=null;

function theme(){return root.dataset.theme==='dark'?'dark':'light'}
function send(f){try{f.contentWindow.postMessage({portalTheme:theme()},'*')}catch(e){}}
function sendAll(){for(var k in frames){send(frames[k])}}

function frameFor(id){
  if(frames[id])return frames[id];
  var f=document.createElement('iframe');
  f.title=ITEMS[id].title;
  f.addEventListener('load',function(){send(f)});
  f.src=ITEMS[id].src;
  main.appendChild(f);
  frames[id]=f;
  return f;
}
function show(id){
  if(!ITEMS[id])id=DEFAULT;
  cur=id;
  var f=frameFor(id);
  for(var k in frames){frames[k].classList.toggle('on',k===id)}
  document.querySelectorAll('nav a').forEach(function(a){
    if(a.dataset.id===id)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');
  });
  ttl.textContent=ITEMS[id].title;
  document.title=ITEMS[id].title+' · Gestão da Manutenção';
  try{localStorage.setItem('portalItem',id)}catch(e){}
  closeMenu();
}
function fromHash(){
  var h=decodeURIComponent((location.hash||'').slice(1));
  if(ITEMS[h])return h;
  var s=null;try{s=localStorage.getItem('portalItem')}catch(e){}
  return ITEMS[s]?s:DEFAULT;
}
addEventListener('hashchange',function(){show(fromHash())});

/* tema único */
document.getElementById('tbtn').addEventListener('click',function(){
  var t=theme()==='dark'?'light':'dark';
  root.dataset.theme=t;
  try{localStorage.setItem('portalTheme',t)}catch(e){}
  sendAll();
});
addEventListener('message',function(e){
  if(e.data&&e.data.portalReady){for(var k in frames){if(frames[k].contentWindow===e.source)send(frames[k])}}
});

/* menu no celular */
var mbtn=document.getElementById('mbtn');
function closeMenu(){document.body.classList.remove('open');mbtn.setAttribute('aria-expanded','false')}
mbtn.addEventListener('click',function(){
  var o=document.body.classList.toggle('open');mbtn.setAttribute('aria-expanded',o?'true':'false');
});
document.getElementById('scrim').addEventListener('click',closeMenu);
addEventListener('keydown',function(e){if(e.key==='Escape')closeMenu()});

var first=fromHash();
if(!location.hash)history.replaceState(null,'','#'+first);
show(first);
})();
</script>
</body>
</html>
