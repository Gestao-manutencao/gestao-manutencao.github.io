<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gestão Operacional</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--ink:#111827;--ink2:#1f2937;--mut:#4b5563;--line:#d6dae1;--chip:#e6e9ee;--head:#0f2a47;--ok:#0e7a3c;--okbg:#d7f2e2;--okbar:#16a34a;--bad:#b42318;--badbg:#fde3e0;--badbar:#dc2626;--warn:#9a5800;--warnbar:#d97706;--track:#e6e8ec;--meta:#111827;--sel:#0f2a47;--selink:#fff;--focus:#2563eb}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1117;--card:#171b23;--ink:#f5f6f8;--ink2:#e6e8ec;--mut:#c5cbd5;--line:#2f3644;--chip:#262c37;--ok:#4ade80;--okbg:#123222;--okbar:#22c55e;--bad:#ff8a80;--badbg:#3d1c1c;--badbar:#f05252;--warn:#fbbf24;--warnbar:#fbbf24;--track:#2a303c;--meta:#f5f6f8;--sel:#e6e8ec;--selink:#0e1117;--focus:#93c5fd}}
:root[data-theme="dark"]{--bg:#0e1117;--card:#171b23;--ink:#f5f6f8;--ink2:#e6e8ec;--mut:#c5cbd5;--line:#2f3644;--chip:#262c37;--ok:#4ade80;--okbg:#123222;--okbar:#22c55e;--bad:#ff8a80;--badbg:#3d1c1c;--badbar:#f05252;--warn:#fbbf24;--warnbar:#fbbf24;--track:#2a303c;--meta:#f5f6f8;--sel:#e6e8ec;--selink:#0e1117;--focus:#93c5fd}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
header{background:var(--head);color:#fff}
.hin{max-width:1240px;margin:0 auto;padding:16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.hin h1{margin:0;font-size:22px;line-height:1.2}
.hin .sub{font-size:14px;color:#e3e9f2;margin-top:2px}
.hin .r{margin-left:auto;display:flex;align-items:center;gap:10px}
.upd{font-size:14px;color:#fff;font-weight:600}
.tema{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:8px;padding:6px 12px;font-size:14px;font-weight:700}
main{max-width:1240px;margin:0 auto;padding:14px 16px 40px}
.fil{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.seg{display:flex;background:var(--chip);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:8px 14px;border-radius:8px;font-weight:700;color:var(--ink2)}
.seg button.on{background:var(--sel);color:var(--selink)}
.ger{margin-left:auto;min-width:0;max-width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:700}
.chip.on{background:var(--sel);border-color:var(--sel);color:var(--selink)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.k{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.k .t{color:var(--mut);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.3px}
.k .v{font-size:30px;font-weight:800;line-height:1.15;margin-top:4px;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.k .v small{font-size:17px;font-weight:700;color:var(--ink2)}
.k .s{color:var(--ink2);font-size:14px;font-weight:600;margin-top:2px}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.ev{font-size:14px;font-weight:800;white-space:nowrap}.ev.up{color:var(--ok)}.ev.dn{color:var(--bad)}.ev.eq{color:var(--warn)}
.eqd{display:inline-block;width:14px;height:3px;border-radius:2px;background:var(--warnbar);vertical-align:middle}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.card h2{margin:0 0 8px;font-size:17px}
.mleg{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:13px;font-weight:700;color:var(--ink2);margin-bottom:8px;align-items:center}
.mleg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.mleg .d{width:14px;height:0;border-top:2px dashed var(--meta);border-radius:0;vertical-align:3px}
.wrap2{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:14px;align-items:start}
.grp{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-weight:800;font-size:14px;text-transform:uppercase;letter-spacing:.3px;padding:8px 2px 6px;border-bottom:1px solid var(--line);margin:4px 0}
.grp span:last-child{text-transform:none;letter-spacing:0;white-space:nowrap}
.lr{display:grid;grid-template-columns:44px minmax(0,1fr) 112px;align-items:center;gap:10px;width:100%;border:2px solid transparent;background:none;border-radius:10px;padding:6px;text-align:left}
.lr:hover{background:var(--chip)}
.lr.on{border-color:var(--sel);background:var(--chip)}
.lr .n{font-weight:800}
.trk{position:relative;height:16px}
.trk .f{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
.trk .m{position:absolute;top:-5px;bottom:-5px;width:0;border-left:2px dashed var(--meta)}
.lr .p{text-align:right;white-space:nowrap}
.lr .p b{font-weight:800}
.lr .p span.x{color:var(--ink2);font-weight:600;font-size:13px}
#rk{scroll-margin-top:10px}
.rh{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin-bottom:8px}
.rh .tt{font-size:19px;font-weight:800}
.rh .ds{font-weight:700;color:var(--ink2)}
.rh .bt{margin-left:auto;display:flex;gap:6px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 11px;font-size:14px;font-weight:700}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 8px}
.tools input{flex:1;min-width:170px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.rr{display:grid;grid-template-columns:18px minmax(0,1fr) 54px minmax(60px,1fr) 34px 46px;align-items:center;gap:8px;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:8px 2px;text-align:left}
.rr:hover{background:var(--chip)}
.rr .ic{font-weight:900;font-size:15px;text-align:center}
.rr .nm{font-weight:700;overflow-wrap:anywhere}
.rr .nm small{display:block;font-weight:600;color:var(--mut);font-size:13px}
.one .rr{grid-template-columns:18px minmax(0,1.3fr) minmax(60px,1fr) 34px 46px}
.one .rr .lw{display:none}
.lc{display:inline-block;text-align:center;font-weight:800;font-size:13px;background:var(--chip);border-radius:6px;padding:2px 0;width:100%}
.bar{height:14px;border-radius:4px;background:var(--okbar);min-width:0}
.bar.z{background:none}
.rr .q{font-weight:800;text-align:right;font-size:16px}
.rr .q.z{color:var(--bad)}
.rd{display:none;padding:8px 2px 12px 26px;border-bottom:1px solid var(--line);font-size:14px;font-weight:600;color:var(--ink2)}
.rd.on{display:block}
.rd b{color:var(--ink)}
.more{width:100%;margin-top:10px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-weight:800}
.sep{font-weight:800;font-size:14px;text-transform:uppercase;letter-spacing:.3px;color:var(--bad);padding:12px 2px 4px;border-bottom:2px solid var(--line)}
.empty{color:var(--ink2);font-weight:600;padding:10px 0}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--ink2);font-weight:800;font-size:13px;padding:8px 6px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top}
td.c,th.c{text-align:right}
tr.cl{cursor:pointer}tr.cl:hover td{background:var(--chip)}
.lsm{display:none;color:var(--mut);font-size:13px;font-weight:600}
@media (max-width:960px){.kpis{grid-template-columns:1fr 1fr}.wrap2{grid-template-columns:1fr}}
@media (max-width:600px){
  .hin h1{font-size:20px}.hin .r{margin-left:0;width:100%;justify-content:space-between}
  .ger{margin-left:0;width:100%}
  .k .v{font-size:26px}
  .lr{grid-template-columns:40px minmax(0,1fr) 104px;gap:8px}
  .rr{grid-template-columns:16px minmax(0,1fr) 46px 30px 42px;gap:6px}
  .rr .bw{display:none}
  .one .rr{grid-template-columns:16px minmax(0,1fr) 30px 42px}
  .rh .bt{margin-left:0;width:100%}.rh .bt .btn{flex:1}
  .hm{display:none}.lsm{display:block}
}
</style>

      <div id="lines"></div>

":"Liomar Carvalho de Oliveira","c":"Operador (a) de Producao I","g":"Rogerio Soares Carreiro","l":"L528","nt":4,"nl":3,"out":{"L527":1},"pv":4},{"id":"99848446","n":"Claudio Rodrigues dos Santos","c":"Operador (a) de Producao I","g":"Rogerio Soares Carreiro","l":"L528","nt":9,"nl":9,"out":{},"pv":9},{"id":"99849022","n":"Caua Anderson da Costa Damas","c":"Operador (a) de Producao I","g":"Michelle Cristine da Silva Severino","l":"L528","nt":2,"nl":0,"out":{"L527":2},"pv":2},{"id":"99852523","n":"Filipe Correa Alves de Souza","c":"Operador (a) de Producao I","g":"Rogerio Soares Carreiro","l":"L528","nt":4,"nl":4,"out":{},"pv":4},{"id":"99853580","n":"Felipe Lopes Correa dos Santos","c":"Operador (a) de Producao I","g":"Rogerio Soares Carreiro","l":"L528","nt":1,"nl":1,"out":{},"pv":1},{"id":"99853582","n":"Chiginoro Bina Toyota","c":"Operador (a) de Producao I","g":"Rogerio Soares Carreiro","l":"L528","nt":3,"nl":1,"out":{"L527":2},"pv":3},{"id":"99853910","n":"Amanda de Farias Lima","c":"Operador (a) de Producao I","g":"Rogerio Soares Carreiro","l":"L528","nt":18,"nl":1,"out":{"L527":17},"pv":18}],"atualizado":"29/10/2026","mes":"Outubro/2026","prev":{"data":"28/10","lines":{"L501":60.53,"L503":37.5,"L505":71.11,"L506":67.5,"L511":78.12,"L512":83.33,"L514":92.59,"L521":66.67,"L541":40.3,"L542":80.0,"L561":50.0,"L562":68.97,"L527":87.1,"L528":100.0},"grupos":{"Todas":69.04,"Retornáveis":67.61,"One Way":70.0}}};
const META=70,TOP=25;
const GRUPOS={'Todas':null,'Retornáveis':['L501','L503','L505','L506','L521','L542'],'One Way':['L511','L512','L514','L541','L561','L562','L527','L528']};
const ORDER=['L501','L503','L505','L506','L521','L542','L511','L512','L514','L541','L561','L562','L527','L528'];
const LINES=ORDER.filter(l=>D.ops.some(o=>o.l===l));
const S={grp:'Todas',line:null,ger:'',f:'all',q:'',all:false,open:null};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const f1=x=>x.toFixed(1).replace('.',',')+'%';
const rel=o=>o.nt>0;
const nome=o=>o.n||('Matrícula '+o.id);
const grpOf=l=>Object.keys(GRUPOS).find(g=>GRUPOS[g]&&GRUPOS[g].includes(l));
const grpLines=g=>LINES.filter(l=>!GRUPOS[g]||GRUPOS[g].includes(l));
const scope=()=>S.line?[S.line]:grpLines(S.grp);
const cls=p=>p>=META?'ok':'bad';
function st(lines){const L=new Set(lines);const o=D.ops.filter(x=>L.has(x.l));const c=o.filter(rel).length,t=o.length,p=t?100*c/t:0;return{c,t,p,falt:Math.max(Math.ceil(t*META/100-1e-9)-c,0),sem:t-c}}
function evoP(cur,pv){if(pv==null)return '';const d=cur-pv;if(Math.abs(d)<0.05)return '<span class="ev eq" title="manteve"><span class="eqd"></span></span>';return d>0?`<span class="ev up" title="subiu">▲</span>`:`<span class="ev dn" title="caiu">▼</span>`}
function evoN(o){if(o.pv==null)return '';const d=o.nt-o.pv;if(!d)return '<span class="ev eq" title="manteve"><span class="eqd"></span></span>';return d>0?`<span class="ev up">▲+${d}</span>`:`<span class="ev dn">▼${d}</span>`}
const pvLine=l=>D.prev&&D.prev.lines?D.prev.lines[l]:null;
const pvGrp=g=>D.prev&&D.prev.grupos?D.prev.grupos[g]:null;
function render(){
  $('mes').textContent=D.mes;$('upd').textContent=D.atualizado;
  $('grp').innerHTML=Object.keys(GRUPOS).map(g=>`<button type="button" class="${g===S.grp?'on':''}" data-g="${g}">${g}</button>`).join('');
  const sc=new Set(scope());const gs=[...new Set(D.ops.filter(o=>o.g&&sc.has(o.l)).map(o=>o.g))].sort((a,b)=>a.localeCompare(b));
  if(S.ger&&!gs.includes(S.ger))S.ger='';
  $('ger').innerHTML='<option value="">Todos os gestores</option>'+gs.map(g=>`<option${g===S.ger?' selected':''}>${esc(g)}</option>`).join('');
  $('chips').innerHTML=`<button type="button" class="chip ${S.line?'':'on'}" data-l="">Visão geral</button>`+grpLines(S.grp).map(l=>`<button type="button" class="chip ${S.line===l?'on':''}" data-l="${l}">${l}</button>`).join('');
  kpis();lines();ranking();gestores();
}
function kpis(){
  const s=st(scope());const pv=S.line?pvLine(S.line):pvGrp(S.grp);
  const ab=grpLines(S.grp).map(l=>({l,...st([l])})).filter(x=>x.p<META);
  const k4=S.line?`<div class="k"><div class="t">Não relataram</div><div class="v ${s.sem?'bad':'ok'}">${s.sem}</div><div class="s">${S.line}</div></div>`
   :`<div class="k"><div class="t">Linhas abaixo da meta</div><div class="v ${ab.length?'bad':'ok'}">${ab.length}<small>/ ${grpLines(S.grp).length}</small></div><div class="s">${ab.map(x=>x.l).join(', ')||'Todas na meta'}</div></div>`;
  $('kpis').innerHTML=`
   <div class="k"><div class="t">% relatando</div><div class="v ${cls(s.p)}">${f1(s.p)} ${evoP(s.p,pv)}</div><div class="s">Meta ${META}%</div></div>
   <div class="k"><div class="t">Relataram</div><div class="v">${s.c}<small>/ ${s.t}</small></div><div class="s">${S.line||(S.grp==='Todas'?'Packaging':S.grp)}</div></div>
   <div class="k"><div class="t">Faltam p/ meta</div><div class="v ${s.falt?'bad':'ok'}">${s.falt}</div>${s.falt?'':'<div class="s ok">Meta atingida</div>'}</div>${k4}`;
}
function lrow(l){const s=st([l]);return `<button type="button" class="lr ${S.line===l?'on':''}" data-l="${l}" data-go="1" aria-label="${l}: ${f1(s.p)}, ${s.c} de ${s.t}">
  <span class="n">${l}</span><span class="trk"><span class="f" style="width:${Math.max(s.p,1)}%;background:${s.p>=META?'var(--okbar)':'var(--badbar)'}"></span><span class="m" style="left:${META}%"></span></span>
  <span class="p"><b class="${cls(s.p)}">${f1(s.p)}</b> <span class="x">${s.c}/${s.t}</span> ${evoP(s.p,pvLine(l))}</span></button>`}
function lines(){
  let h='';
  const gl=S.grp==='Todas'?['Retornáveis','One Way']:[S.grp];
  for(const g of gl){const L=grpLines(g);if(!L.length)continue;const s=st(L);h+=`<div class="grp"><span>${g}</span><span><span class="${cls(s.p)}">${f1(s.p)}</span> · ${s.c}/${s.t} ${evoP(s.p,pvGrp(g))}</span></div>`+L.map(lrow).join('')}
  $('lines').innerHTML=h;
}
function rrow(o,mx){
  const w=o.nt?Math.max(4,100*o.nt/mx):0;const out=Object.entries(o.out||{});
  return `<button type="button" class="rr" data-op="${o.id}" aria-expanded="${S.open===o.id}">
   <span class="ic ${rel(o)?'ok':'bad'}">${rel(o)?'✓':'✕'}</span>
   <span class="nm">${esc(nome(o))}<small>${o.n?o.id:'sem cadastro'}</small></span>
   <span class="lw"><span class="lc">${o.l}</span></span>
   <span class="bw"><span class="bar ${o.nt?'':'z'}" style="display:block;width:${w}%"></span></span>
   <span class="q ${o.nt?'':'z'}">${o.nt}</span><span>${evoN(o)}</span></button>
   <div class="rd ${S.open===o.id?'on':''}">Gestor: <b>${esc(o.g||'—')}</b><br>Cargo: <b>${esc(o.c||'—')}</b><br>Notas na ${o.l}: <b>${o.nl}</b>${out.length?' · Outras linhas: <b>'+out.map(([k,v])=>k+' '+v).join(', ')+'</b>':''}</div>`;
}
function ranking(){
  const L=new Set(scope()),q=S.q.trim().toLowerCase();
  let base=D.ops.filter(o=>L.has(o.l)&&(!S.ger||o.g===S.ger));
  const s={c:base.filter(rel).length,t:base.length};s.p=s.t?100*s.c/s.t:0;s.falt=Math.max(Math.ceil(s.t*META/100-1e-9)-s.c,0);
  let O=base.filter(o=>(S.f==='all'||(S.f==='sem'?!rel(o):rel(o)))&&(!q||(o.n+' '+o.id+' '+o.g).toLowerCase().includes(q)));
  O.sort((a,b)=>b.nt-a.nt||ORDER.indexOf(a.l)-ORDER.indexOf(b.l)||(!a.n)-(!b.n)||nome(a).localeCompare(nome(b)));
  const mx=Math.max(1,...O.map(o=>o.nt));
  const lim=(S.line||S.ger||q||S.f==='sem'||S.all)?O.length:TOP;
  const com=O.filter(rel),sem=O.filter(o=>!rel(o));
  let rows='';
  if(S.f==='all'){const vc=com.slice(0,lim);rows=vc.map(o=>rrow(o,mx)).join('');const rest=Math.max(lim-vc.length,0);
    if(sem.length&&rest>0)rows+=`<div class="sep">Não relataram (${sem.length})</div>`+sem.slice(0,rest).map(o=>rrow(o,mx)).join('');}
  else rows=O.slice(0,lim).map(o=>rrow(o,mx)).join('');
  const titulo=S.line||(S.ger?S.ger:(S.grp==='Todas'?'Packaging':S.grp));
  $('rk').innerHTML=`<div class="rh"><span class="tt">Ranking · ${esc(titulo)}</span><span class="ds"><span class="${cls(s.p)}">${f1(s.p)}</span> · ${s.c}/${s.t}${s.falt?` · <span class="bad">faltam ${s.falt}</span>`:' · <span class="ok">na meta</span>'}</span>
    <span class="bt">${S.line||S.ger?'<button type="button" class="btn" data-copy="1">Copiar link</button>':''}${S.line?'<button type="button" class="btn" data-l="">Visão geral</button>':''}</span></div>
   <div class="mleg"><span class="ok">✓ relatou</span><span class="bad">✕ sem nota</span><span><span class="ev up">▲</span> subiu</span><span><span class="ev dn">▼</span> caiu</span><span><span class="eqd"></span> manteve</span></div>
   <div class="tools"><input id="q" type="search" placeholder="Buscar operador, matrícula ou gestor" aria-label="Buscar" value="${esc(S.q)}">
    <div class="seg" id="ff"><button type="button" data-f="all" class="${S.f==='all'?'on':''}">Todos</button><button type="button" data-f="sem" class="${S.f==='sem'?'on':''}">Sem nota (${base.length-s.c})</button></div></div>
   <div id="rows" class="${S.line?'one':''}">${rows||'<div class="empty">Nenhum operador encontrado.</div>'}</div>
   ${lim<O.length?`<button type="button" class="more" data-all="1">Mostrar todos os ${O.length} operadores</button>`:''}`;
  $('q').addEventListener('input',e=>{S.q=e.target.value;const pos=e.target.selectionStart;ranking();const i=$('q');i.focus();try{i.setSelectionRange(pos,pos)}catch(_){}} );
}
function gestores(){
  const L=new Set(scope());const G={};
  D.ops.filter(o=>L.has(o.l)&&o.g).forEach(o=>{const r=G[o.g]=G[o.g]||{c:0,t:0,l:new Set()};r.t++;r.l.add(o.l);if(rel(o))r.c++});
  const rows=Object.entries(G).map(([g,v])=>({g,...v,p:100*v.c/v.t})).sort((a,b)=>a.p-b.p||b.t-a.t||a.g.localeCompare(b.g));
  $('tg').innerHTML='<tr><th>Gestor</th><th class="hm">Linhas</th><th class="c">Relataram</th><th class="c">%</th></tr>'+rows.map(r=>{const ls=LINES.filter(l=>r.l.has(l)).join(', ');return `<tr class="cl ${S.ger===r.g?'on':''}" data-ger="${esc(r.g)}"><td><b>${esc(r.g)}</b><span class="lsm">${ls}</span></td><td class="hm">${ls}</td><td class="c"><b>${r.c}/${r.t}</b></td><td class="c"><b class="${cls(r.p)}">${f1(r.p)}</b></td></tr>`}).join('');
}
function hashOut(){const p=[];if(S.line)p.push(S.line);else if(S.grp!=='Todas')p.push('g='+encodeURIComponent(S.grp));if(S.ger)p.push('ger='+encodeURIComponent(S.ger));try{history.replaceState(null,'',p.length?'#'+p.join('&'):location.pathname+location.search)}catch(e){}}
function hashIn(){const h=decodeURIComponent((location.hash||'').slice(1));if(!h)return false;let go=false;h.split('&').forEach(x=>{if(LINES.includes(x)){S.line=x;S.grp=grpOf(x)||'Todas';go=true}else if(x.startsWith('g=')&&Object.prototype.hasOwnProperty.call(GRUPOS,x.slice(2)))S.grp=x.slice(2);else if(x.startsWith('ger=')){S.ger=x.slice(4);go=true}});return go}
function irRank(){if(innerWidth>960)return;requestAnimationFrame(()=>$('rk').scrollIntoView({behavior:'smooth',block:'start'}))}
function reset(){S.all=false;S.open=null;S.q='';S.f='all'}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-g],[data-l],[data-copy],[data-ger],[data-f],[data-all],[data-op]');if(!t)return;
  if(t.dataset.g!==undefined){S.grp=t.dataset.g;S.line=null;reset();render();hashOut();return}
  if(t.dataset.l!==undefined){const l=t.dataset.l||null;S.line=l;if(l&&GRUPOS[S.grp]&&!GRUPOS[S.grp].includes(l))S.grp='Todas';reset();render();hashOut();if(l)irRank();return}
  if(t.dataset.ger!==undefined){S.ger=S.ger===t.dataset.ger?'':t.dataset.ger;reset();render();hashOut();if(S.ger)requestAnimationFrame(()=>$('rk').scrollIntoView({behavior:'smooth',block:'start'}));return}
  if(t.dataset.f){S.f=t.dataset.f;S.open=null;ranking();return}
  if(t.dataset.all){S.all=true;ranking();return}
  if(t.dataset.op){S.open=S.open===t.dataset.op?null:t.dataset.op;const d=t.nextElementSibling;document.querySelectorAll('.rd.on').forEach(x=>{if(x!==d){x.classList.remove('on');x.previousElementSibling.setAttribute('aria-expanded','false')}});d.classList.toggle('on',S.open===t.dataset.op);t.setAttribute('aria-expanded',String(S.open===t.dataset.op));return}
  if(t.dataset.copy){hashOut();const u=location.href;const done=()=>{const o=t.textContent;t.textContent='Link copiado';setTimeout(()=>t.textContent=o,1600)};
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(u).then(done,()=>fb(u,done));else fb(u,done)}
});
function fb(u,done){const i=document.createElement('input');i.value=u;document.body.appendChild(i);i.select();try{document.execCommand('copy');done()}catch(e){}i.remove()}
$('ger').addEventListener('change',e=>{S.ger=e.target.value;reset();render();hashOut()});
(function(){const root=document.documentElement;let t=null;try{t=localStorage.getItem('tema')}catch(e){}if(t)root.dataset.theme=t;
  $('tema').addEventListener('click',()=>{const dark=root.dataset.theme?root.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;root.dataset.theme=dark?'light':'dark';try{localStorage.setItem('tema',root.dataset.theme)}catch(e){}})})();
const veio=hashIn();render();if(veio)irRank();
</script>
